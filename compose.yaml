services:
  planner:
    build: ./services/planner
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OPERATION_PATH: /plan
      UPSTREAM_URL: http://grid-model:8081/score
    depends_on:
      grid-model:
        condition: service_healthy
  grid-model:
    build: ./services/grid-model
    healthcheck:
      test: ["CMD", "bash", "-ec", ": </dev/tcp/127.0.0.1/8081"]
      interval: 1s
      timeout: 2s
      retries: 20
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      OPERATION_PATH: /score
